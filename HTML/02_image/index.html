

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image</title>
</head>
<body>
    <!-- we can take image with 2 methods -->

    <!-- 1. absolute url-->
       <!-- it means to use the img which is online drictly -->

    <img src="https://www.shutterstock.com/image-photo/cute-baby-dog-260nw-2774353169.jpg" alt="dog">

    <!-- 2.relative url-->
       <!-- it means to use the img by saving it on an file offline and then use -->

    <img src="./asset/puppy.jpg" alt="">
</body>
</html>
