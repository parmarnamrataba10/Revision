
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>basic</title>
</head>
<body>
   
   
                                     <!-- what are Tag , Elements  and Atrribute -->

<!--Tag-->
<p></p>
<h1></h1>
<h2></h2> <!--etc-->

<!--Elements-->

<h1>this is an Elements</h1>

<!--Attribute-->

<h1 class="text">this is an example </h1>


                                                <!-- block elements -->

   <!-- block level elements will occupy the width and start from new line -->      

<!--example-->

<h1>this is the heading </h1>
<hr>
<br>


                                               <!--inline elements-->

     <!--inline elements will take the space as their need and not start with new line-->        
     
     <!--example-->

     <i></i>
     <em></em>
     <strong></strong>
     <b></b>
     <u></u>
     <mark></mark>
                 
                                               <!--list types-->

           <!--1. order list-->
      <ol type="A">
      <li>list 1</li>
      <li>list 2</li>
      <li>list 3</li>
      </ol>


        <!--2. unorder list -->
      <ul>
      <li>list 1</li>
      <li>list 2</li>
      <li>list 3</li>
      </ul>  


        <!-- 3. description list -->
    <dl>
    <dt>description</dt>
    <dd>this is desc 1</dd>
    <dd>this is desc 2</dd>
    <dd>this is desc 3</dd>
    </dl>


</body>
</html>
